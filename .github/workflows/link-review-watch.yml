name: Friend Link Review Watch

on:
  schedule:
    # GitHub scheduled workflows are best-effort and can be delayed under load.
    # Use an off-peak minute to reduce queueing versus common :00/:15/:30/:45 slots.
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      AUTO_REVIEW_AFTER_HOURS: 12
      REQUIRE_BACKLINK: ${{ vars.REQUIRE_BACKLINK || 'false' }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure workflow labels
        run: node scripts/ensure-labels.mjs

      - name: Review mature friend link PRs
        run: node scripts/scan-pending-prs.mjs
